name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Restore or Generate Debug Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          # Prefer a stable key from GitHub Actions Secrets so repeated APK builds
          # have the same signing identity and can update an existing installation.
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            echo "Using repository-provided debug signing key."
          elif [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

          if [ ! -f debug.keystore ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not configured. A temporary debug key will be generated; later APK builds may not update-install over this APK."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Signing certificate fingerprint:"
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true

      - name: Ensure Environment Configuration
        run: |
          if [ ! -f .env ]; then
            echo "Creating fallback .env configuration from .env.example..."
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Locate Android Project Root
        id: project-root
        run: |
          echo "Scanning repository for Android Gradle project root..."
          if [ -f "gradlew" ]; then
            ROOT_PATH="."
          elif [ -f "android/gradlew" ]; then
            ROOT_PATH="android"
          else
            GRADLEW_FILE=$(find . -maxdepth 3 -name "gradlew" -type f | head -n 1)
            if [ -n "$GRADLEW_FILE" ]; then
              ROOT_PATH=$(dirname "$GRADLEW_FILE")
            else
              SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" -type f | head -n 1)
              if [ -n "$SETTINGS_FILE" ]; then
                ROOT_PATH=$(dirname "$SETTINGS_FILE")
              else
                ROOT_PATH="."
              fi
            fi
          fi
          echo "Project root determined: $ROOT_PATH"
          echo "PROJECT_DIR=$ROOT_PATH" >> $GITHUB_ENV
          echo "project_dir=$ROOT_PATH" >> $GITHUB_OUTPUT

      - name: Ensure Gradle Wrapper Exists
        working-directory: ${{ env.PROJECT_DIR || '.' }}
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found in $(pwd); generating Gradle wrapper 9.3.1..."
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.PROJECT_DIR || '.' }}
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Build with Gradle
        working-directory: ${{ env.PROJECT_DIR || '.' }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK Generation
        run: |
          APK_FILE=$(find . -type f -name "*debug*.apk" -path "*/outputs/apk/*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
          fi

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "SUCCESS: APK successfully found at $APK_FILE"
            ls -lh "$APK_FILE"
            echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV
          else
            echo "ERROR: No APK generated! Listing build outputs:"
            find . -maxdepth 5 -name "outputs" -o -name "*.apk"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ntt-app-debug
          path: ${{ env.APK_PATH }}
          retention-days: 14
